name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pybnafar
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install ruff mypy fhir.resources pandas pyarrow types-requests types-setuptools
      - name: Run Ruff
        run: ruff check .
      - name: Run MyPy
        run: mypy . --ignore-missing-imports

  test:
    name: Unit Tests
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pybnafar
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install .[test]
          pip install pytest-cov
      - name: Run Tests
        run: |
          pytest tests/ --cov=pybnafar --cov-report=xml

  publish-pypi:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # Mandatory for OIDC (Trusted Publishers)
    defaults:
      run:
        working-directory: ./pybnafar
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: pip install build
      - name: Build binary wheel and source tarball
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # If using Trusted Publishers, you don't need 'password'
          # Just ensure the PyPI project is configured to trust this repo/workflow
          skip-existing: true

  publish-docker:
    name: Publish Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: ./pybnafar
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            labiomics/pybnafar:latest
            labiomics/pybnafar:${{ github.ref_name }}
