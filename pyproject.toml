[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybnafar"
version = "2.1.0"
authors = [
  { name="Fabiano Menegidio", email="fabiano.menegidio@example.com" },
]
description = "High-performance Python SDK and Data Governance for the Brazilian Pharmaceutical Database (BNAFAR)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["SUS", "BNAFAR", "Health Informatics", "Data Science", "Brazil", "FHIR", "RNDS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "tqdm>=4.65.0",
    "streamlit>=1.24.0",
    "plotly>=5.15.0",
    "fhir.resources>=7.1.0"
]

[project.scripts]
pybnafar = "pybnafar.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-mock",
]

[project.urls]
Homepage = "https://github.com/usuario/pybnafar"
Documentation = "https://github.com/usuario/pybnafar/blob/main/docs/DOCUMENTATION.md"
Repository = "https://github.com/usuario/pybnafar.git"
Issues = "https://github.com/usuario/pybnafar/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pybnafar*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "B", "I", "N"]
ignore = ["D100", "D104"]

[tool.ruff.isort]
known-first-party = ["pybnafar"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--strict-markers"
